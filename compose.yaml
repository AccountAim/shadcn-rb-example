services:
  web:
    build:
      context: .
      target: development
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: ""
    image: shadcnrb-example:dev
    container_name: shadcnrb-example
    ports:
      - "4000:3000"
    volumes:
      - .:/rails
      - ../shadcn-rb:/shadcn-rb
    environment:
      RAILS_ENV: development
      BINDING: 0.0.0.0
      # Bundler local-gem override: swap the git-fetched shadcn-rb with the
      # sibling repo at runtime. Dot→"__", dash→"___" is bundler's env-var
      # name mangling for the config key `local.shadcn-rb`.
      BUNDLE_LOCAL__SHADCN___RB: /shadcn-rb
      # Gemfile pins `branch: main` for CI/prod, but the gem dev typically
      # works on feature branches — don't reject local overrides that land
      # on a different branch.
      BUNDLE_DISABLE_LOCAL_BRANCH_CHECK: "true"
      # Same reason, different check: ignore the lockfile's revision when the
      # local override's branch has been rebased past it (dev workflow).
      BUNDLE_DISABLE_LOCAL_REVISION_CHECK: "true"
    tty: true
    stdin_open: true
    healthcheck:
      # Rails exposes `/up` for load balancer probes. `docker compose up --wait`
      # watches this to know the server is actually serving, not just booting.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
